spring.application.name=backend

server.port=8080
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=60MB
server.tomcat.connection-timeout=60000

# Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/school_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me}
app.jwt.ttlSeconds=${APP_JWT_TTL_SECONDS:86400}

app.crypto.aesKeyBase64=${APP_AES_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

app.storage.policyDir=${APP_POLICY_DIR:./data/policy-files}
app.storage.approvalDir=${APP_APPROVAL_DIR:./data/approval-files}

app.llm.enabled=${APP_LLM_ENABLED:false}
app.llm.baseUrl=${APP_LLM_BASE_URL:}
app.llm.apiKey=${APP_LLM_API_KEY:}
app.llm.model=${APP_LLM_MODEL:}
app.llm.endpoint=${APP_LLM_ENDPOINT:/v1/chat/completions}
app.llm.timeoutSeconds=${APP_LLM_TIMEOUT_SECONDS:30}
